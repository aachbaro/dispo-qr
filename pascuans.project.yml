schema_version: "1.0"
name: extrabeam
type: web-app
status: active
repository:
  remote: https://github.com/aachbaro/dispo-qr.git
  default_branch: main
presence:
  local-desktop: required
  home-server: required
execution:
  requires: [python, node]
  allowed_capabilities: [linux, windows, python, node, docker, network]
validation:
  - name: v2-backend-tests
    type: command
    command: "python v2/backend/manage.py test api"
    requires: [python]
  - name: v2-frontend-build
    type: command
    command: "npm --prefix v2/frontend run build"
    requires: [node]
ai:
  implementer: claude
  reviewer: codex
  allow_auto_commit: false
  allow_auto_push: false
  allow_auto_merge: false
  allow_auto_deploy: false
deployment:
  method: docker-compose
  compose_file: v2/docker-compose.yml
  env_file: v2/.env
  service: extrabeam-v2-front
  healthcheck: "http://127.0.0.1:8080/"
standards: []
shared: {}
